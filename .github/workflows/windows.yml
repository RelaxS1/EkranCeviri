name: Windows sürümü

# Gerçek bir Windows makinesinde derler, testleri koşar ve arkadaşların
# indirip çift tıklayacağı tek dosyalık .exe'yi üretir.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CIKTI: bin/Release/net8.0-windows10.0.19041.0/win-x64/publish/EkranCeviri.exe

jobs:
  derle:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Derle
        run: dotnet build EkranCeviri.csproj -c Debug --nologo

      # TEST KAPISI: testler geçmezse .exe üretilmez.
      - name: Testleri koş
        run: dotnet run --project Testler/Testler.csproj -c Debug --nologo

      # SAF KOŞUCU: WPF'e dokunmayan üretim dosyaları (kalite kapıları,
      # defterler, hareket kararı, arıza/teşhis günlüğü) ayrı bir projede
      # derlenir. macOS'ta da koşan tek kanıt yolu bu; CI'da Windows'ta bir
      # kez daha koşar ki iki koşucu birbirinden sapmasın.
      - name: Saf testleri koş
        run: dotnet run --project Testler/Saf/Saf.csproj -c Debug --nologo

      - name: Tek dosyalık .exe üret
        run: dotnet publish EkranCeviri.csproj -c Release --nologo

      - name: Çıktıyı yükle
        uses: actions/upload-artifact@v4
        with:
          name: EkranCeviri-windows
          path: ${{ env.CIKTI }}
          if-no-files-found: error

      # Sürüm etiketi (v1.0.0 gibi) atıldığında Releases sayfasına koyar.
      # Üçüncü taraf eylem yerine gh CLI: runner'da hazır geliyor ve
      # tedarik zinciri yüzeyi eklemiyor.
      - name: Sürüm yayınla
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notlar.md <<'NOT'
          ## Kurulum

          1. Aşağıdan **EkranCeviri.exe** dosyasını indir
          2. Çift tıkla — kurulum yok, .NET kurmana gerek yok
          3. Windows "bilinmeyen yayımcı" uyarısı verirse:
             **Ek bilgi** → **Yine de çalıştır**
             (Uygulama imzasız olduğu için çıkıyor; kaynak kodu bu depoda)

          Uygulama saatin yanındaki tepsi simgesine yerleşir.
          Simgeye **çift tıkla** → sohbet alanını seç → çeviri balonların
          üstüne yazılır.

          ## Bu sürümde yeni

          - **Çeviri çubuğu düğmeleri:** ✕ kapat · 📋 çevirileri kopyala ·
            👁 orijinali göster/gizle · ✨ Grok ile yeniden çevir ·
            ⌨️ yazdığımı çevir · 💬 cevap öner · Canlı anahtarı
          - **Cevap öner:** sohbete uygun 3 cevap önerisi (karşı dilde +
            Türkçe anlamı), tek tıkla kopyalanır
          - **Önce hızlı göster, sonra kaliteyle düzelt:** hızlı model anında
            yazar, kalite modeli arka planda düzeltir; balon 8 saniyeden
            uzun süredir ekrandaysa artık oynatılmaz, düzeltme yalnız
            hafızaya gider
          - **Canlı mod iki şeritli:** ekran okuma ile ağ beklemesi ayrıldı;
            küçük balonlar kaçmaz, yarım kalan çeviri kalıcılaşmaz, aynı
            mesaj için ücretli motora en fazla 2 kez gidilir
          - **Yazdığımı Çevir kapısı:** çıktı hem ham hem biçimli hâliyle
            denetlenir; reddedilirse mesajın değişmez ve nedeni gösterilir
          - **Sohbet hafızası:** yerel `sohbet_gecmisi.jsonl`; menüden
            kapatılır ve silinir
          - **Arıza günlüğü** (`%APPDATA%\EkranCeviri\ariza.log`): başarısız
            her çeviri tek satır — mesaj metni YAZILMAZ
          - Menü yeniden düzenlendi: **Kim yazıyor · Bana çevir · Gelişmiş**

          ## Yapay zekâ anahtarı

          İlk açılışta sorulur. **Anahtarsız da çalışır** (ücretsiz
          motorlar) ama İsviçre/Bavyera lehçelerini ücretsiz motorlar
          doğru çeviremiyor.

          Anahtar almak: console.x.ai → API Keys → Create API Key
          Sonradan girmek: tepsi simgesine sağ tıkla → Gelişmiş →
          Yapay Zekâ Anahtarı

          Anahtarın Windows'un kendi şifrelemesiyle, yalnız senin
          bilgisayarında saklanır.

          **Gereken:** Windows 10 sürüm 2004 (build 19041) veya üstü.
          NOT
          gh release create "${GITHUB_REF_NAME}" "${CIKTI}" \
            --title "Ekran Çeviri ${GITHUB_REF_NAME}" \
            --notes-file notlar.md
